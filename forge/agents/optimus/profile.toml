# Optimus — identity file 1 of 2 (the profile).
# Mirrors Mark VI's app/profiles/optimus.py: agent_id, model policy, tool
# allowlist, Cell policy. The Warden engine reads this as data; it contains no
# "Optimus" string of its own. Adding Centurion later = a sibling folder like
# this one, plus its own system_prompt.md. No engine edit (§2).

agent_id = "optimus"
name = "Optimus"
domain = "systems, code & infrastructure"

# Model IDs live only in profiles (Rule 10, mirrored from Mark VI). The Warden
# never hardcodes one; the offline demo overrides it with the deterministic
# ScriptedModel.
#
# DeepSeek rather than Anthropic: this peer is meant to run continuously, and
# metered Anthropic spend is the cost this whole system exists to avoid. Mark
# VI's own agents are pinned to the same model, so there is one provider to
# reason about and one key that matters.
#
# Known weakness, and the reason the harness matters more than the model here:
# non-Anthropic providers do not enforce a tool schema's `required`, and this
# one will claim work it did not do. The Warden is what makes that survivable —
# every failure returns is_error the model must read, and edit_file's
# content-hash freshness means it cannot edit a file it has not actually seen.
# If reported-but-not-done work starts showing up, that is the signal to
# revisit this line, not the prompt.
model = "deepseek:deepseek-v4-pro"

# Tool allowlist — Optimus is a coding agent. "coding" expands to the curated
# file / shell / graph tool group. This list IS the security boundary (§2/§4).
#
# "web" adds search and page-fetch. Debugging is the reason: without it the only
# sources are this repo and whatever the model memorised, so an unfamiliar error
# or a changed API signature has to be guessed at. These are harness-side
# instruments and do not touch the Cell's network posture below — see
# forge/tools/web.py.
tools = ["coding", "web"]

# One working mode with the safety gate always on; "plan" would make it
# read-only for review (§6).
permission_mode = "act"

# The single iteration ceiling (§3). NOT Mark VI's 30: that guard is sized for
# a chat backend answering a question, where thirty tool calls is generous. A
# coding agent spends thirty orienting in an unfamiliar file — read, grep, read
# again — and a real change lands well past it. This is a runaway guard, not a
# work limit, and 30 was silently truncating ordinary jobs half-finished.
max_iterations = 400

[cell]
# A coding agent needs the network, and denying it does not make it safer — it
# makes it useless in a way that reads as a bug. `git push`, `git fetch`, a
# package install and most test suites all fail at the socket, and the error
# they produce ("Failed to connect to github.com port 443") looks like a broken
# machine rather than a policy.
#
# What actually bounds this agent is not the socket: it is the permission gate
# on irreversible commands, the worktree/root confinement, and the fact that
# the Cell's environment has every provider key stripped from it before any
# command runs (see subprocess_cell._base_env) — so code executed here cannot
# exfiltrate the credentials that pay for the model.
#
# The default for a NEW agent stays false. This is a considered exception for
# the one profile whose whole job is working in real repositories.
allow_network = true
cpus = 2.0
memory_mb = 2048
timeout_s = 120
# backend = "docker"   # optional per-agent override of FORGE_CELL_BACKEND

# Who git records for work this agent does. Committing under the operator's
# name makes the history lie about who wrote the code, which costs most later —
# when someone is working out why a change was made and asks the wrong person.
# No account is required anywhere: git stores a name and an address, and a host
# links it to a profile only if that address belongs to a registered account.
[git]
name = "Optimus Mark II"
email = "optimus@spedatox.systems"
