name: CI Pipeline

# Test on every branch; deploy only what has passed, and only from main.
#
# Before this existed, the peers on the server were whatever someone last
# pulled by hand — on 2026-08-05 that was 26 commits behind main, including
# worktree isolation, which is a safety fix. Green CI said nothing about what
# was actually running, because nothing connected the two.
#
# Nothing about the server (host, user, path, port) lives in this file — it is
# all in Actions Secrets, so a public repo never discloses the deployment.
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST      server hostname or IP
#   SSH_USER      deploy user
#   SSH_KEY       that user's PRIVATE deploy key (public half in authorized_keys)
#   SSH_PORT      SSH port (optional; defaults to 22)
#   DEPLOY_PATH   absolute path of the clone on the server (/opt/forge-mk1)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: {}

env:
  FORGE_CELL_BACKEND: subprocess

jobs:
  test:
    name: Run Tests & Demo Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,providers]

      - name: Run Pytest Test Suite
        run: |
          python -m pytest

      - name: Run Forge Demo Verification
        run: |
          python -m forge demo

  # The install scripts are the first thing anyone runs on a new machine and
  # the last thing anyone tests, so they rot silently and the failure lands on
  # a person who has no way to tell a broken script from a broken machine.
  # Both are exercised from a clean checkout, on the two platforms they target.
  installer:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A venv inside a venv is not what the runner needs, and the point is the
      # script's own verification step: it ends by listing the agents, so a
      # broken install fails here with the reason attached.
      - name: ./install.sh
        if: runner.os != 'Windows'
        run: ./install.sh --no-venv --extras dev

      # `powershell`, not `pwsh`: 5.1 is what ships on Windows, it is what a
      # person gets when they open a terminal, and it is the stricter parser —
      # it reads a BOM-less script as ANSI and chokes on its own comments.
      - name: .\install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: .\install.ps1 -NoVenv -Extras dev

      # Bare `python` is not trustworthy here: windows-latest ships several
      # Python installs, and the interpreter install.ps1/install.sh actually
      # put packages into (FORGE_PY, written to $GITHUB_ENV by both scripts)
      # can differ from whatever `python` resolves to in this fresh step. That
      # gap is exactly how "pip install succeeded" two steps up turned into
      # "ModuleNotFoundError: pydantic" here — the install was real, it just
      # landed in an interpreter this step never asked for.
      - name: The installed Forge runs a real turn (Linux)
        if: runner.os != 'Windows'
        run: |
          "$FORGE_PY" -m forge demo

      - name: The installed Forge runs a real turn (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & $env:FORGE_PY -m forge demo

  deploy:
    name: Deploy to the execution host
    needs: test                       # never deploy a red build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A newer push supersedes an in-flight deploy; two of these must never
    # interleave a git reset with a systemctl restart.
    concurrency:
      group: deploy-forge
      cancel-in-progress: true

    steps:
      # Fail with the reason rather than a connection error nobody can read.
      # Deliberately NOT a graceful skip: a deploy that quietly does nothing is
      # the exact failure this pipeline exists to end.
      - name: Check deploy secrets are configured
        # Secrets arrive as ENV, never interpolated into the script body.
        # `${{ secrets.SSH_KEY }}` inline expands a multi-line PEM straight into
        # the shell: the first line becomes an unterminated quote and the step
        # dies of a syntax error before it checks anything. That is what made a
        # fully-configured repo report a broken deploy, with no SSH attempt ever
        # reaching the server.
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=""
          [ -n "$SSH_HOST" ]    || missing="$missing SSH_HOST"
          [ -n "$SSH_USER" ]    || missing="$missing SSH_USER"
          [ -n "$SSH_KEY" ]     || missing="$missing SSH_KEY"
          [ -n "$DEPLOY_PATH" ] || missing="$missing DEPLOY_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing — add them under"
            echo "::error::Settings → Secrets and variables → Actions."
            exit 1
          fi
          # A PEM that lost its line breaks in transit is the other way this
          # fails, and it fails later and less legibly, at the SSH handshake.
          case "$SSH_KEY" in
            *"PRIVATE KEY"*) ;;
            *) echo "::error::SSH_KEY does not look like a private key."
               echo "::error::Paste the whole file including the BEGIN/END lines."
               exit 1 ;;
          esac

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # The clone is owned by root (deploy/README.md installs it as root,
            # and forge@.service has no User= so systemd runs it as root), but
            # this script runs as the deploy account. Git 2.35.2+ refuses to
            # operate on a tree owned by someone else — "detected dubious
            # ownership" — and exits 128 before doing anything.
            #
            # Declared here rather than left as a manual step on the box: the
            # pipeline exists because "whatever someone last did by hand" was
            # 26 commits behind, and a deploy that depends on undocumented
            # server state is the same failure wearing a different hat. A
            # rebuilt host works on the first run.
            #
            # Idempotent: --add appends unconditionally, so without the check
            # every deploy would grow ~/.gitconfig by one more identical line.
            if ! git config --global --get-all safe.directory 2>/dev/null \
                 | grep -Fxq "${{ secrets.DEPLOY_PATH }}"; then
              echo "marking ${{ secrets.DEPLOY_PATH }} as a safe directory"
              git config --global --add safe.directory "${{ secrets.DEPLOY_PATH }}"
            fi

            # The sudoers rules below match on an exact command line, so the
            # unit-file path is hardcoded and CANNOT be a variable. That makes
            # DEPLOY_PATH and that literal two statements of the same fact —
            # check them here, where the message can say so, rather than at the
            # sudo call, where it fails as an unexplained permission denial.
            if [ "${{ secrets.DEPLOY_PATH }}" != "/opt/forge-mk1" ]; then
              echo "::error::DEPLOY_PATH is not /opt/forge-mk1, but the sudoers"
              echo "::error::rules in /etc/sudoers.d/forgedeploy hardcode that"
              echo "::error::path. Move the clone, or update both together."
              exit 1
            fi

            # Mirror main exactly. .env and .env.<agent> are gitignored and so
            # survive; the venv lives in .venv and is likewise untracked.
            git fetch --prune origin main
            git reset --hard origin/main

            # forge is installed editable, so code is live after the reset —
            # but a new dependency in pyproject.toml would not be. Cheap when
            # nothing has changed.
            .venv/bin/python -m pip install -q -e ".[providers]"

            # The unit file is version-controlled. Sync it only when it
            # actually differs, so an unchanged deploy does not daemon-reload.
            # Every root action below is spelled out verbatim because
            # /etc/sudoers.d/forgedeploy matches on the exact command line —
            # this account has no general sudo and no shell through it.
            if ! cmp -s deploy/forge@.service /etc/systemd/system/forge@.service; then
              echo "unit file changed — installing"
              sudo /usr/bin/install -m 644 -o root -g root \
                /opt/forge-mk1/deploy/forge@.service /etc/systemd/system/forge@.service
              sudo /usr/bin/systemctl daemon-reload
            fi

            # Restarting drops whatever a peer was mid-way through. That is the
            # accepted cost of staying current; the alternative is drifting 26
            # commits behind again. Peers reconnect to Igor with capped backoff.
            sudo /usr/bin/systemctl restart forge@optimus forge@centurion

            # Restart=always would happily mask a crash loop, so give it long
            # enough to fall over (RestartSec=5s) and then insist it is up.
            # Unrolled rather than looped: the sudoers entries are per-unit, so
            # a variable here would not match and every check would fail closed.
            # `|| true` on each probe is load-bearing: is-active exits non-zero
            # for a dead unit, and under `set -e` that would abort the script
            # before it printed WHY the deploy failed.
            sleep 12
            optimus="$(sudo /usr/bin/systemctl is-active forge@optimus || true)"
            centurion="$(sudo /usr/bin/systemctl is-active forge@centurion || true)"

            failed=0
            if [ "$optimus" != "active" ]; then
              echo "::error::forge@optimus is $optimus after deploy"
              sudo /usr/bin/systemctl status forge@optimus --no-pager -l | tail -30 || true
              failed=1
            fi
            if [ "$centurion" != "active" ]; then
              echo "::error::forge@centurion is $centurion after deploy"
              sudo /usr/bin/systemctl status forge@centurion --no-pager -l | tail -30 || true
              failed=1
            fi
            [ "$failed" -eq 0 ] || exit 1

            echo "deployed $(git log -1 --format='%h %s')"
