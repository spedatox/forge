<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man: Web Swinger</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            border: 3px solid #e63946;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(230, 57, 70, 0.4), 0 0 80px rgba(230, 57, 70, 0.15);
        }

        canvas {
            display: block;
            background: linear-gradient(180deg, #1a1a3e 0%, #16213e 40%, #1a1a2e 100%);
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .hud-panel {
            background: rgba(0,0,0,0.6);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        #score { color: #ffd700; }
        #combo { color: #ff6b6b; font-size: 13px; }

        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #overlay.hidden { opacity: 0; }

        #overlay h1 {
            font-size: 48px;
            color: #e63946;
            text-shadow: 0 0 20px rgba(230,57,70,0.8), 2px 2px 0 #000;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        #overlay .subtitle {
            color: #ccc;
            font-size: 15px;
            margin-bottom: 18px;
        }

        #overlay .instructions {
            color: #aaa;
            font-size: 13px;
            text-align: center;
            line-height: 1.8;
        }

        #overlay .instructions span {
            color: #ffd700;
            font-weight: bold;
        }

        #gameover-text {
            font-size: 36px;
            color: #e63946;
            font-weight: bold;
            display: none;
            text-shadow: 0 0 15px rgba(230,57,70,0.7);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game" width="800" height="500"></canvas>
        <div id="hud">
            <div class="hud-panel">🕷️ Score: <span id="score">0</span></div>
            <div class="hud-panel">Web: <span id="web-status">Ready</span></div>
            <div class="hud-panel" id="combo"></div>
        </div>
        <div id="overlay">
            <h1>🕸️ SPIDER-MAN</h1>
            <div class="subtitle">Web Swinger</div>
            <div id="gameover-text">GAME OVER</div>
            <div class="instructions">
                <span>CLICK &amp; HOLD</span> to swing on web<br>
                <span>RELEASE</span> to let go and fly<br>
                <span>Dodge</span> the green goblin bombs!<br>
                Collect <span style="color:#ffd700;">★</span> for points
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        // --- HUD elements ---
        const scoreEl = document.getElementById('score');
        const comboEl = document.getElementById('combo');
        const webStatusEl = document.getElementById('web-status');
        const overlay = document.getElementById('overlay');
        const gameoverText = document.getElementById('gameover-text');

        // --- Game State ---
        let gameStarted = false;
        let gameOver = false;
        let score = 0;

        // --- Spider-Man ---
        const spidey = {
            x: 200,
            y: 200,
            vx: 0,
            vy: 0,
            radius: 18,
            swinging: false,
            anchorX: 0,
            anchorY: 0,
            webLength: 0,
            webMaxLen: 0,
        };

        // --- Web anchor points (buildings) ---
        const anchors = [];
        function spawnAnchor() {
            anchors.push({
                x: W + 20,
                y: 40 + Math.random() * (H - 120),
                radius: 6,
            });
        }

        // --- Collectibles ---
        const stars = [];
        function spawnStar() {
            stars.push({
                x: W + 20,
                y: 40 + Math.random() * (H - 80),
                radius: 10,
                pulse: Math.random() * Math.PI * 2,
            });
        }

        // --- Obstacles (goblin bombs) ---
        const bombs = [];
        function spawnBomb() {
            bombs.push({
                x: W + 20,
                y: 40 + Math.random() * (H - 80),
                radius: 14,
                vx: -2 - Math.random() * 3,
                vy: (Math.random() - 0.5) * 2,
            });
        }

        // --- Particles ---
        const particles = [];

        function burstParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
                const speed = 2 + Math.random() * 5;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    decay: 0.02 + Math.random() * 0.04,
                    color,
                    radius: 1.5 + Math.random() * 2.5,
                });
            }
        }

        // --- Mouse / Input ---
        let mouseDown = false;
        let mouseX = 0, mouseY = 0;

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            if (!gameStarted || gameOver) {
                startGame();
                return;
            }
            mouseDown = true;
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener('mouseup', () => { mouseDown = false; });
        canvas.addEventListener('mouseleave', () => { mouseDown = false; });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!gameStarted || gameOver) {
                startGame();
                return;
            }
            mouseDown = true;
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
            mouseY = e.touches[0].clientY - rect.top;
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
            mouseY = e.touches[0].clientY - rect.top;
        });
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            mouseDown = false;
        });

        function startGame() {
            gameStarted = true;
            gameOver = false;
            score = 0;
            spidey.x = 200;
            spidey.y = 200;
            spidey.vx = 0;
            spidey.vy = 0;
            spidey.swinging = false;
            anchors.length = 0;
            stars.length = 0;
            bombs.length = 0;
            particles.length = 0;
            overlay.classList.add('hidden');
            gameoverText.style.display = 'none';
            scoreEl.textContent = '0';
            comboEl.textContent = '';
            webStatusEl.textContent = 'Ready';
            // Initial anchors
            for (let i = 0; i < 3; i++) {
                anchors.push({
                    x: 250 + i * 200 + Math.random() * 100,
                    y: 60 + Math.random() * (H - 160),
                    radius: 6,
                });
            }
        }

        // --- Physics constants ---
        const GRAVITY = 0.45;
        const MAX_SPEED = 16;
        const WEB_RANGE = 320;
        const WEB_MIN = 35;
        const WEB_RETRACT_SPEED = 2.5;
        const WEB_EXTEND_SPEED = 1.8;

        // --- Update ---
        function update() {
            if (!gameStarted || gameOver) return;

            // --- Swinging: attach web ---
            if (mouseDown && !spidey.swinging) {
                // Shoot web toward mouse cursor, but find nearest anchor within range
                const mx = mouseX;
                const my = mouseY;
                const dx = mx - spidey.x;
                const dy = my - spidey.y;
                const distToMouse = Math.sqrt(dx * dx + dy * dy);

                if (distToMouse < WEB_RANGE && distToMouse > WEB_MIN) {
                    spidey.swinging = true;
                    // The anchor is fixed at the point where we shot the web
                    spidey.anchorX = mx;
                    spidey.anchorY = my;
                    spidey.webLength = distToMouse;
                    spidey.webMaxLen = distToMouse;
                    webStatusEl.textContent = 'Swinging!';
                    burstParticles(spidey.anchorX, spidey.anchorY, '#fff', 8);
                }
            }

            // --- Release web ---
            if (!mouseDown && spidey.swinging) {
                spidey.swinging = false;
                webStatusEl.textContent = 'Ready';
                // Natural boost from release — keep current velocity
            }

            if (spidey.swinging) {
                // === CONSTRAINED PENDULUM PHYSICS ===
                // Apply gravity to velocity
                spidey.vy += GRAVITY;

                // Move by velocity
                spidey.x += spidey.vx;
                spidey.y += spidey.vy;

                // Constrain to web: project position back onto circle around anchor
                let dx = spidey.x - spidey.anchorX;
                let dy = spidey.y - spidey.anchorY;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 0.001) {
                    // Normalize direction from anchor to spidey
                    const nx = dx / dist;
                    const ny = dy / dist;

                    // Pull spidey back to web length
                    spidey.x = spidey.anchorX + nx * spidey.webLength;
                    spidey.y = spidey.anchorY + ny * spidey.webLength;

                    // Remove the radial component of velocity (keep only tangential)
                    const radialVel = spidey.vx * nx + spidey.vy * ny;
                    spidey.vx -= radialVel * nx;
                    spidey.vy -= radialVel * ny;
                }

                // --- Web retract/extend: mouse controls web length ---
                if (mouseDown) {
                    const mdx = mouseX - spidey.anchorX;
                    const mdy = mouseY - spidey.anchorY;
                    const targetLen = Math.sqrt(mdx * mdx + mdy * mdy);

                    if (targetLen > WEB_MIN && targetLen < WEB_RANGE) {
                        if (targetLen < spidey.webLength) {
                            // Retract (pull toward anchor)
                            spidey.webLength = Math.max(targetLen, spidey.webLength - WEB_RETRACT_SPEED);
                        } else if (targetLen > spidey.webLength + 5) {
                            // Extend (let out slack)
                            spidey.webLength = Math.min(targetLen, spidey.webLength + WEB_EXTEND_SPEED);
                        }
                    }
                }
            } else {
                // === FREE-FALL / BALLISTIC ===
                spidey.vy += GRAVITY;
                spidey.x += spidey.vx;
                spidey.y += spidey.vy;

                // Gentle air drag
                spidey.vx *= 0.998;
                spidey.vy *= 0.998;
            }

            // Speed cap
            const speed = Math.sqrt(spidey.vx * spidey.vx + spidey.vy * spidey.vy);
            if (speed > MAX_SPEED) {
                spidey.vx = (spidey.vx / speed) * MAX_SPEED;
                spidey.vy = (spidey.vy / speed) * MAX_SPEED;
            }

            // --- Boundaries ---
            if (spidey.y > H - spidey.radius) {
                spidey.y = H - spidey.radius;
                spidey.vy *= -0.5;
                if (Math.abs(spidey.vy) < 1) spidey.vy = 0;
            }
            if (spidey.y < spidey.radius) {
                spidey.y = spidey.radius;
                spidey.vy *= -0.5;
            }
            if (spidey.x < spidey.radius) {
                spidey.x = spidey.radius;
                spidey.vx *= -0.5;
            }
            // Wrap around right side
            if (spidey.x > W + 30) {
                spidey.x = -30;
            }
            if (spidey.x < -30) {
                spidey.x = W + 30;
            }

            // --- Spawn anchors ---
            // Keep anchors ahead of player
            while (anchors.length < 5) spawnAnchor();

            // --- Spawn stars ---
            if (stars.length < 4 && Math.random() < 0.02) spawnStar();

            // --- Spawn bombs ---
            if (bombs.length < 6 && Math.random() < 0.015) spawnBomb();

            // --- Move entities ---
            for (let a of anchors) a.x -= 1.2;
            for (let s of stars) s.x -= 1.2;
            for (let b of bombs) {
                b.x += b.vx;
                b.y += b.vy;
            }

            // --- Collision: Stars ---
            for (let i = stars.length - 1; i >= 0; i--) {
                const s = stars[i];
                const dx = spidey.x - s.x;
                const dy = spidey.y - s.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < spidey.radius + s.radius) {
                    score += 100;
                    scoreEl.textContent = score;
                    burstParticles(s.x, s.y, '#ffd700', 12);
                    stars.splice(i, 1);
                    comboEl.textContent = '+100!';
                    setTimeout(() => { comboEl.textContent = ''; }, 600);
                }
            }

            // --- Collision: Bombs ---
            for (let i = bombs.length - 1; i >= 0; i--) {
                const b = bombs[i];
                const dx = spidey.x - b.x;
                const dy = spidey.y - b.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < spidey.radius + b.radius - 4) {
                    burstParticles(b.x, b.y, '#ff4500', 20);
                    burstParticles(spidey.x, spidey.y, '#e63946', 15);
                    endGame();
                    return;
                }
            }

            // --- Offscreen cleanup ---
            for (let i = anchors.length - 1; i >= 0; i--) {
                if (anchors[i].x < -30) anchors.splice(i, 1);
            }
            for (let i = stars.length - 1; i >= 0; i--) {
                if (stars[i].x < -30) stars.splice(i, 1);
            }
            for (let i = bombs.length - 1; i >= 0; i--) {
                if (bombs[i].x < -60 || bombs[i].y < -60 || bombs[i].y > H + 60) bombs.splice(i, 1);
            }

            // --- Update particles ---
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function endGame() {
            gameOver = true;
            spidey.swinging = false;
            webStatusEl.textContent = 'Down!';
            gameoverText.style.display = 'block';
            overlay.classList.remove('hidden');
        }

        // --- Render ---
        function drawCityBackground() {
            // Buildings silhouette
            ctx.fillStyle = '#0d0d2b';
            const buildingPositions = [50, 130, 210, 320, 430, 520, 610, 700, 770];
            for (let bx of buildingPositions) {
                const bh = 80 + Math.sin(bx * 0.3 + Date.now() * 0.0001) * 30;
                const bw = 40 + Math.sin(bx * 0.7) * 15;
                ctx.fillRect(bx - bw/2, H - bh, bw, bh);
            }

            // Windows
            ctx.fillStyle = '#ffe066';
            for (let bx of buildingPositions) {
                const bh = 80 + Math.sin(bx * 0.3 + Date.now() * 0.0001) * 30;
                for (let wy = H - bh + 8; wy < H - 4; wy += 14) {
                    for (let wx = bx - 14; wx <= bx + 10; wx += 12) {
                        if (Math.random() < 0.6) {
                            ctx.fillRect(wx, wy, 5, 5);
                        }
                    }
                }
            }
        }

        function drawWeb(x1, y1, x2, y2) {
            ctx.strokeStyle = 'rgba(255,255,255,0.8)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            // Glow
            ctx.strokeStyle = 'rgba(200,220,255,0.3)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        function drawSpidey(x, y, radius) {
            ctx.save();
            ctx.translate(x, y);

            // Body glow
            const glow = ctx.createRadialGradient(0, 0, radius * 0.5, 0, 0, radius * 1.3);
            glow.addColorStop(0, 'rgba(230,57,70,0.4)');
            glow.addColorStop(1, 'rgba(230,57,70,0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, radius * 1.3, 0, Math.PI * 2);
            ctx.fill();

            // Body
            ctx.fillStyle = '#e63946';
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();

            // Dark blue sections
            ctx.fillStyle = '#1d3557';
            ctx.beginPath();
            ctx.arc(0, 0, radius, -0.3, Math.PI + 0.3);
            ctx.fill();

            // Web pattern on mask
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            for (let a = -0.6; a <= 0.6; a += 0.3) {
                ctx.beginPath();
                ctx.moveTo(0, -3);
                ctx.lineTo(Math.sin(a) * radius, Math.cos(a) * radius * 0.6);
                ctx.stroke();
            }

            // Eyes (big white)
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(-5, -5, radius * 0.35, radius * 0.28, -0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(5, -5, radius * 0.35, radius * 0.28, 0.2, 0, Math.PI * 2);
            ctx.fill();

            // Eye outlines
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.ellipse(-5, -5, radius * 0.35, radius * 0.28, -0.2, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(5, -5, radius * 0.35, radius * 0.28, 0.2, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        function render() {
            ctx.clearRect(0, 0, W, H);

            // Sky gradient
            const sky = ctx.createLinearGradient(0, 0, 0, H);
            sky.addColorStop(0, '#0a0a2e');
            sky.addColorStop(0.5, '#16213e');
            sky.addColorStop(1, '#1a1a2e');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, W, H);

            // Stars in sky
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 40; i++) {
                const sx = (i * 197 + 53) % W;
                const sy = (i * 139 + 17) % (H * 0.6);
                const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(Date.now() * 0.001 + i));
                ctx.globalAlpha = twinkle;
                ctx.fillRect(sx, sy, 1.5, 1.5);
            }
            ctx.globalAlpha = 1;

            // Moon
            ctx.fillStyle = '#f0f0e0';
            ctx.beginPath();
            ctx.arc(680, 70, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0a0a2e';
            ctx.beginPath();
            ctx.arc(690, 65, 27, 0, Math.PI * 2);
            ctx.fill();

            drawCityBackground();

            // --- Draw anchors ---
            for (let a of anchors) {
                // Building peg
                ctx.fillStyle = '#555';
                ctx.fillRect(a.x - 4, a.y - 8, 8, 16);
                ctx.fillStyle = '#888';
                ctx.fillRect(a.x - 3, a.y - 7, 6, 14);
                // Glow
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                ctx.arc(a.x, a.y - 5, a.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // --- Draw aiming line ---
            if (mouseDown && !spidey.swinging && gameStarted && !gameOver) {
                const adx = mouseX - spidey.x;
                const ady = mouseY - spidey.y;
                const adist = Math.sqrt(adx * adx + ady * ady);
                if (adist < WEB_RANGE && adist > WEB_MIN) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                    ctx.setLineDash([5, 5]);
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(spidey.x, spidey.y);
                    ctx.lineTo(mouseX, mouseY);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            // --- Draw web if swinging ---
            if (spidey.swinging && gameStarted && !gameOver) {
                drawWeb(spidey.anchorX, spidey.anchorY, spidey.x, spidey.y);
            }

            // --- Draw stars ---
            for (let s of stars) {
                ctx.fillStyle = '#ffd700';
                const pulseR = s.radius + Math.sin(Date.now() * 0.005 + s.pulse) * 2;
                // Star shape
                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i * Math.PI * 2) / 5 - Math.PI / 2;
                    const x1 = Math.cos(angle) * pulseR;
                    const y1 = Math.sin(angle) * pulseR;
                    const x2 = Math.cos(angle + Math.PI / 5) * pulseR * 0.4;
                    const y2 = Math.sin(angle + Math.PI / 5) * pulseR * 0.4;
                    if (i === 0) ctx.moveTo(x1, y1);
                    else ctx.lineTo(x1, y1);
                    ctx.lineTo(x2, y2);
                }
                ctx.closePath();
                ctx.fill();

                // Glow
                ctx.fillStyle = 'rgba(255,215,0,0.4)';
                ctx.beginPath();
                ctx.arc(0, 0, pulseR * 1.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // --- Draw bombs ---
            for (let b of bombs) {
                // Bomb body
                ctx.fillStyle = '#2d6a2d';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#3a8a3a';
                ctx.beginPath();
                ctx.arc(b.x - 2, b.y - 3, b.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();

                // Fuse
                ctx.strokeStyle = '#8b4513';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(b.x + b.radius - 2, b.y - b.radius);
                ctx.quadraticCurveTo(b.x + b.radius + 6, b.y - b.radius - 10, b.x + b.radius + 8, b.y - b.radius - 12);
                ctx.stroke();

                // Spark
                const sparkLife = Date.now() * 0.01;
                ctx.fillStyle = `hsl(${30 + Math.sin(sparkLife) * 20}, 100%, 60%)`;
                ctx.beginPath();
                ctx.arc(b.x + b.radius + 8, b.y - b.radius - 13, 3 + Math.sin(sparkLife * 2) * 1, 0, Math.PI * 2);
                ctx.fill();
            }

            // --- Draw Spider-Man ---
            if (gameStarted && !gameOver) {
                drawSpidey(spidey.x, spidey.y, spidey.radius);

                // Web trail when not swinging but moving fast
                if (!spidey.swinging && Math.abs(spidey.vx) + Math.abs(spidey.vy) > 5) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(spidey.x, spidey.y);
                    ctx.lineTo(spidey.x - spidey.vx * 3, spidey.y - spidey.vy * 3);
                    ctx.stroke();
                }
            }

            // --- Draw particles ---
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        // --- Game Loop ---
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // --- Initial render ---
        render();
        gameLoop();
    </script>
</body>
</html>
